<!doctype html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AkakOven · Admin dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./admin.css"></head><body><header><a href="./index.html">← AkakOven</a><p>ADMIN DASHBOARD</p></header><main><section id="locked" class="login"><p class="eyebrow">PRIVATE AREA</p><h1>Welcome back.</h1><p>Sign in untuk urus tempahan, jualan dan stok AkakOven.</p><form id="login-form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button type="submit">Sign in</button><p id="login-status"></p></form></section><div id="dashboard" hidden><div class="top"><div><p class="eyebrow">OVERVIEW</p><h1>AkakOven, at a glance.</h1></div><button id="signout">Sign out</button></div><section id="stats" class="stats"></section><section class="panel"><div class="panel-title"><div><p class="eyebrow">LATEST ORDERS</p><h2>Pesanan perlu tindakan</h2></div><button id="refresh">Refresh</button></div><div id="orders" class="orders"></div></section><section class="grid"><section class="panel"><p class="eyebrow">LOW STOCK</p><h2>Perlu restock</h2><div id="low-stock"></div></section><section class="panel"><p class="eyebrow">ADD NEW ITEM</p><h2>Tambah produk</h2><form id="product-form" class="compact"><label>Nama produk<input name="name" required placeholder="Contoh: Garlic cheese sourdough"></label><div><label>Harga jualan (RM)<input name="price" required type="number" min="0" step="0.01"></label><label>Kos seunit (RM)<input name="cost" required type="number" min="0" step="0.01"></label></div><label>Stok<input name="stock" required type="number" min="0"></label><button type="submit">Simpan produk</button><p id="product-status"></p></form></section></section></div></main><script src="./firebase-runtime-config.js"></script><script type="module" src="./admin.js"></script></body></html>
